<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purple Insurance</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <a class="logo" href="index.html"><span class="accent">Purple</span><span> Insurance</span></a>


        <nav class="main-nav">
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="auto.html">Auto</a></li>
                <li><a href="life.html">Life</a></li>
            </ul>
        </nav>

    </header>
    <main class="main-content">

        <form>
            <label for="my-name">Full Name<span class="required">*</span></label>
            <input id="name" type="text" autocomplete="name" aria-required="true">
            <label for ="my-email">Email<span class="required">*</span></label>
            <input id="my-email" type="text" autocomplete="name"aria-required="true">

            <label for ="my-phone">Phone<span class="required">*</span></label>
            <input id="my-phone" type="text" autocomplete="name"aria-required="true">
            <fieldset>
                <legend>Preferred Contact Method</legend>
                <input id="pref-phone" type="radio" name="contact-method" value="phone">
                <label for="pref-phone">Phone</label>
                <input id="pref-email" type="radio" name="contact-method" value="email">
                <label for="pref-email">Email</label>
            </fieldset>
            <label for="my-message">Message</label>
            <textarea name="my-message" id="my-message" autocomplete="message"></textarea>
            <input type="submit" name="my-submit" id="my-submit" value="Submit">
        </form>







    </main>

    <footer class="main-footer">
    <p> Purple Insurance Copyright &copy; 2026</p>
    <nav>
        <ul>
            <li><a href="index.html">About Us</a></li>
            <li><a href="contactus.html">Contact Us</a></li>
            <li><a href="faq.html">FAQ</a></li>
        </  ul>
    </nav>
</footer>   

    
</body>
</html>
